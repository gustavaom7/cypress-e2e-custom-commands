name: Cypress Regression Tests 🚀

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies 📦
        run: npm ci

      - name: Run lint 🔍
        run: npm run lint

  # Fast feedback on every push/PR: only the tests tagged @smoke, on desktop
  # and on a mobile viewport (iPhone X, GUI specs only).
  smoke:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: desktop
            command: npm run test:smoke
          - viewport: mobile
            command: npm run test:smoke:mobile
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Cypress run (smoke - ${{ matrix.viewport }}) 🌲
        uses: cypress-io/github-action@v6
        continue-on-error: true
        id: smoke-run
        with:
          install-command: npm ci
          command: ${{ matrix.command }}

      - name: Generate HTML Report 📊
        if: always()
        run: npm run generate:report

      - name: Upload smoke report 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.viewport }}
          retention-days: 7
          path: cypress/reports

      - name: Fail workflow if smoke tests failed ❌
        if: steps.smoke-run.outcome == 'failure'
        run: exit 1

  # API load testing with k6. Smoke (1 VU, 30s) runs on every push/PR; the
  # heavier load profile (10 VUs) only runs on pushes to main/master.
  perf-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup k6 ⚡
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke ⚡
        run: k6 run performance/k6/smoke.test.js

      - name: Upload k6 smoke report 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-report
          retention-days: 7
          path: performance/reports

  perf-load:
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup k6 ⚡
        uses: grafana/setup-k6-action@v1

      - name: k6 load ⚡
        run: k6 run performance/k6/load.test.js

      - name: Upload k6 load report 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-report
          retention-days: 7
          path: performance/reports

  # Full regression suite, split across parallel jobs by spec folder. Only
  # runs on pushes to main/master so PRs stay fast (smoke-only) while main
  # still gets full coverage on every merge.
  regression:
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [api, gui]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Cypress run (regression - ${{ matrix.suite }}) 🌲
        uses: cypress-io/github-action@v6
        continue-on-error: true
        id: regression-run
        with:
          install-command: npm ci
          command: npm run test:${{ matrix.suite }} -- --browser chrome

      - name: Upload raw mochawesome json 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-json-${{ matrix.suite }}
          retention-days: 1
          path: cypress/reports/mochawesome*.json

      - name: Fail workflow if regression tests failed ❌
        if: steps.regression-run.outcome == 'failure'
        run: exit 1

  # Merges the per-shard JSON into one HTML report and publishes it, once
  # both regression shards have finished (regardless of pass/fail).
  merge-regression-report:
    needs: regression
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies 📦
        run: npm ci

      - name: Download all regression shard reports 📥
        uses: actions/download-artifact@v4
        with:
          pattern: regression-json-*
          path: cypress/reports
          merge-multiple: true

      - name: Generate merged HTML Report 📊
        run: npm run generate:report

      - name: Upload merged regression report 📊
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          retention-days: 7
          path: cypress/reports

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: cypress/reports
          branch: gh-pages

  lighthouse:
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Lighthouse audit 🔦
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          command: npm run test:lighthouse
          browser: chrome

  # Visual regression against baselines committed from CI (Linux) runs.
  # Skipped until baselines exist; see the "Visual baselines" workflow.
  visual:
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Check for baselines 🔎
        id: baselines
        run: echo "present=$(ls cypress/visual/cypress-image-diff-screenshots/baseline/*.png >/dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Visual regression 🖼️
        if: steps.baselines.outputs.present == 'true'
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          command: npm run test:visual
          browser: chrome

      # Diffs are only useful to inspect a failure; keep them briefly
      - name: Upload visual diffs 🖼️
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            cypress/visual/cypress-image-diff-screenshots/comparison
            cypress/visual/cypress-image-diff-screenshots/diff
            cypress/visual/cypress-image-diff-html-report
          retention-days: 3
